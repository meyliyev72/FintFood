        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
          description: ''
    put:
      operationId: api_v1_recipes_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecipeWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecipeWriteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeWrite'
          description: ''
    patch:
      operationId: api_v1_recipes_partial_update
      parameters:
      - in: path
        name: slug
