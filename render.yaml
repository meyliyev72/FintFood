# FintFood — Render blueprint (single-service deployment)
# Rend backenda faqat bitta web service bor: Django backend
# o'zi build qilingan Next.js frontend'ni ham serve qiladi
# (WHITENOISE_ROOT -> frontend/out), alohida frontend service kerak emas.
# Render dashboard: New -> Blueprint -> bu repo'ni tanlang.
# Qo'lma yo'riqnoma: https://render.com/docs/blueprint-spec

databases:
  - name: fintfood-db
    plan: free
    region: frankfurt
    databaseName: fintfood
    user: fintfood

services:
  - type: web
    name: fintfood-backend
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    healthCheckPath: /api/v1/schema/
    buildCommand: cd ../frontend && npm ci && npm run build && cd ../backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: fintfood-backend.onrender.com
      - key: DATABASE_SSLMODE
        value: require
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECURE_COOKIES
        value: "true"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DATABASE_NAME
        fromDatabase:
          name: fintfood-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: fintfood-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: fintfood-db
          property: password
      - key: DATABASE_HOST
        fromDatabase:
          name: fintfood-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: fintfood-db
          property: port
      - key: CORS_ALLOWED_ORIGINS
        value: https://fintfood-backend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://fintfood-backend.onrender.com
      - key: FRONTEND_URL
        value: https://fintfood-backend.onrender.com